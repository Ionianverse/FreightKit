<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FreightKit embedded calculator</title><meta name="description" content="An embeddable FreightKit custom calculator runtime for calculators configured through the builder."><meta name="theme-color" content="#0b5fff"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png"><link rel="manifest" href="../site.webmanifest"><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f8fafc;margin:0;padding:12px}.embed-shell{max-width:760px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(15,23,42,.05)}.embed-shell h1{font-size:clamp(1.35rem,3vw,1.8rem);margin-top:0}.embed-shell .lead{font-size:1rem}.embed-value{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;color:#0f3f90;overflow-wrap:anywhere}.embed-brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:.85rem}.embed-brand a{font-weight:700}.embed-shell dl{display:grid;gap:6px}.embed-shell dl div{display:grid;grid-template-columns:1fr auto;gap:12px}.embed-shell dd{margin:0;font-weight:600}.embed-shell button{margin-top:8px}@media(max-width:480px){body{padding:6px}.embed-shell{padding:14px}.embed-shell dl div{grid-template-columns:1fr}}</style></head><body><main id="main" class="embed-shell"><span class="badge">FreightKit calculator</span><h1 id="embed-title">Loading calculator…</h1><p id="embed-description" class="lead">A shareable calculation tool.</p><div id="embed-error" class="error-box" role="alert" hidden></div><form id="embed-form"></form><div id="embed-output" class="custom-output" aria-live="polite"></div><details style="margin-top:14px"><summary>Formula</summary><code id="embed-formula"></code></details><div class="embed-brand"><span>Powered by FreightKit</span><a href="../custom-calculator/" target="_blank" rel="noopener noreferrer">Build your own</a></div></main><script>(()=>{'use strict';
const MAX_VARS=12;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function validName(name){return /^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(name)&&!['__proto__','prototype','constructor','this','new','function','return','var','let','const','window','document','globalThis'].includes(name);}
function encodeConfig(cfg){const bytes=new TextEncoder().encode(JSON.stringify(cfg));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function decodeConfig(text){if(!/^[A-Za-z0-9_-]+$/.test(text)||text.length>12000)throw Error('This share link is malformed or too large.');let b64=text.replace(/-/g,'+').replace(/_/g,'/');b64+='='.repeat((4-b64.length%4)%4);const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}
function normalizeConfig(cfg){if(!cfg||typeof cfg!=='object')throw Error('Calculator setup must be a JSON object.');const title=String(cfg.title||cfg.t||'My Calculator').trim().slice(0,80);const unit=String(cfg.unit??cfg.u??'').trim().slice(0,24);const description=String(cfg.description||'').trim().slice(0,180);const formula=String(cfg.formula||cfg.f||'').trim();let source=cfg.variables||null;
 if(!source&&Array.isArray(cfg.n))source=cfg.n.map((name,i)=>({name,label:cfg.l?.[i]||name,defaultValue:cfg.d?.[i]??0,unit:''}));
 if(!Array.isArray(source)||source.length<1||source.length>MAX_VARS)throw Error('A calculator must have between 1 and '+MAX_VARS+' variables.');
 const names=new Set();const vars=source.map((v,i)=>{const name=String(v.name??'').trim();if(!validName(name))throw Error('Variable '+(i+1)+' needs a valid name (letters, numbers and underscores; cannot start with a number).');if(names.has(name))throw Error('Variable names must be unique: '+name);names.add(name);const label=String(v.label||name).trim().slice(0,60);const defaultValue=Number(v.defaultValue??v.d??0);const min=(v.min===null||v.min===''||v.min===undefined)?null:Number(v.min);const max=(v.max===null||v.max===''||v.max===undefined)?null:Number(v.max);const step=Number(v.step||1);if(!Number.isFinite(defaultValue))throw Error('Default value for '+name+' must be a finite number.');if(min!==null&&!Number.isFinite(min))throw Error('Minimum for '+name+' must be a finite number.');if(max!==null&&!Number.isFinite(max))throw Error('Maximum for '+name+' must be a finite number.');if(min!==null&&max!==null&&min>max)throw Error('Minimum cannot exceed maximum for '+name+'.');if(min!==null&&defaultValue<min||max!==null&&defaultValue>max)throw Error('Default value for '+name+' must be inside its range.');if(!(step>0&&Number.isFinite(step)))throw Error('Step for '+name+' must be greater than zero.');return {name,label,unit:String(v.unit||'').trim().slice(0,20),defaultValue,min,max,step};});
 if(!title)throw Error('Enter a calculator name.');if(!formula||formula.length>240)throw Error('Enter a formula up to 240 characters.');return {version:2,title,unit,description,formula,variables:vars};}
// A small arithmetic parser evaluates expressions without eval() or Function().
function evaluateFormula(source,values){if(typeof source!=='string'||source.length>240)throw Error('Formula is empty or too long.');let tokens=[],i=0;while(i<source.length){const rest=source.slice(i);if(/^\s+/.test(rest)){i+=rest.match(/^\s+/)[0].length;continue;}const num=rest.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);if(num){tokens.push({type:'num',value:Number(num[0])});i+=num[0].length;continue;}const ident=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);if(ident){tokens.push({type:'id',value:ident[0]});i+=ident[0].length;continue;}const op=rest.match(/^(\*\*|[+\-*/%^(),])/);if(op){tokens.push({type:op[0]==='**'?'op':'symbol',value:op[0]});i+=op[0].length;continue;}throw Error('Unsupported character in formula near “'+rest.slice(0,8)+'”.');}tokens.push({type:'eof',value:''});let pos=0;const peek=()=>tokens[pos];const take=()=>tokens[pos++];const expect=x=>{if(peek().value!==x)throw Error('Expected “'+x+'” in formula.');take();};const funcs={sqrt:{min:1,max:1,fn:Math.sqrt},pow:{min:2,max:2,fn:Math.pow},min:{min:1,max:MAX_VARS,fn:Math.min},max:{min:1,max:MAX_VARS,fn:Math.max},abs:{min:1,max:1,fn:Math.abs},round:{min:1,max:1,fn:Math.round},floor:{min:1,max:1,fn:Math.floor},ceil:{min:1,max:1,fn:Math.ceil},log:{min:1,max:1,fn:Math.log},exp:{min:1,max:1,fn:Math.exp}};
 function primary(){const t=take();if(t.type==='num')return t.value;if(t.value==='('){const x=expression(0);expect(')');return x;}if(t.value==='+'||t.value==='-'){const x=primary();return t.value==='-'?-x:x;}if(t.type==='id'){if(peek().value==='('){take();if(!funcs[t.value])throw Error('Unsupported function: '+t.value);const args=[];if(peek().value!==')'){do{args.push(expression(0));if(peek().value!==',')break;take();}while(true);}expect(')');const fn=funcs[t.value];if(args.length<fn.min||args.length>fn.max)throw Error(t.value+'() expects '+(fn.min===fn.max?fn.min:fn.min+' or more')+' argument(s).');if(t.value==='sqrt'&&args[0]<0)throw Error('sqrt() needs a value of zero or more.');if(t.value==='log'&&args[0]<=0)throw Error('log() needs a value greater than zero.');return fn.fn(...args);}if(t.value==='PI')return Math.PI;if(t.value==='E')return Math.E;if(!Object.prototype.hasOwnProperty.call(values,t.value))throw Error('Formula references unknown variable “'+t.value+'”.');return values[t.value];}throw Error('Unexpected token “'+t.value+'” in formula.');}
 function expression(minPrec){let left=primary();while(true){let op=peek().value;const prec={'+':1,'-':1,'*':2,'/':2,'%':2,'^':3,'**':3}[op]||0;if(prec<minPrec||prec===0)break;take();const right=expression(prec+(op==='^'||op==='**'?0:1));if((op==='/'||op==='%')&&right===0)throw Error('Division by zero is not allowed.');if(op==='+')left+=right;else if(op==='-')left-=right;else if(op==='*')left*=right;else if(op==='/')left/=right;else if(op==='%')left%=right;else left=Math.pow(left,right);if(!Number.isFinite(left))throw Error('Formula result is not a finite number.');}return left;}
 const out=expression(0);if(peek().type!=='eof')throw Error('Unexpected token “'+peek().value+'” after formula.');if(!Number.isFinite(out))throw Error('The result is not a finite number.');return out;}

function downloadCSV(filename,rows){const escape=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const content='\ufeff'+rows.map(r=>r.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function boot(){const err=$('embed-error');try{const hash=location.hash.slice(1);if(!hash)throw Error('No calculator setup was included in this embed link. Open the FreightKit builder and copy a fresh embed code.');const cfg=normalizeConfig(decodeConfig(hash));const defaults={};cfg.variables.forEach(v=>defaults[v.name]=v.defaultValue);evaluateFormula(cfg.formula,defaults);$('embed-title').textContent=cfg.title;$('embed-description').textContent=cfg.description||'Enter the values below and calculate the result.';$('embed-formula').textContent=cfg.formula;document.title=cfg.title+' | FreightKit';const form=$('embed-form');form.innerHTML=cfg.variables.map(v=>'<div class="field"><label for="v_'+escapeHtml(v.name)+'">'+escapeHtml(v.label)+(v.unit?' <small>('+escapeHtml(v.unit)+')</small>':'')+'</label><input id="v_'+escapeHtml(v.name)+'" data-name="'+escapeHtml(v.name)+'" type="number" step="'+escapeHtml(v.step)+'" '+(v.min!==null?'min="'+escapeHtml(v.min)+'"':'')+' '+(v.max!==null?'max="'+escapeHtml(v.max)+'"':'')+' value="'+escapeHtml(v.defaultValue)+'" required></div>').join('')+'<button class="btn" type="submit">Calculate</button>';form.addEventListener('submit',e=>{e.preventDefault();try{const values={};cfg.variables.forEach(v=>{const el=form.querySelector('[data-name="'+v.name+'"]');const raw=el.value.trim();const n=raw===''?NaN:Number(raw);if(!Number.isFinite(n))throw Error(v.label+' must be a valid number.');if(v.min!==null&&n<v.min)throw Error(v.label+' must be at least '+v.min+'.');if(v.max!==null&&n>v.max)throw Error(v.label+' must be no more than '+v.max+'.');values[v.name]=n;});const result=evaluateFormula(cfg.formula,values);if(!Number.isFinite(result))throw Error('The result is not a finite number.');err.hidden=true;const output=$('embed-output');output.innerHTML='<p class="muted-small">Calculated result</p><div class="embed-value">'+escapeHtml(result.toLocaleString(undefined,{maximumFractionDigits:8}))+(cfg.unit?' '+escapeHtml(cfg.unit):'')+'</div><details><summary>Formula and inputs</summary><p><code>'+escapeHtml(cfg.formula)+'</code></p><dl>'+cfg.variables.map(v=>'<div><dt>'+escapeHtml(v.label)+'</dt><dd>'+escapeHtml(values[v.name])+(v.unit?' '+escapeHtml(v.unit):'')+'</dd></div>').join('')+'</dl></details><p class="muted-small">Check units and assumptions before making a business decision.</p><button type="button" class="btn secondary" id="embed-export">Download CSV</button>'; $('embed-export').onclick=()=>downloadCSV((cfg.title||'freightkit-calculator').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-result.csv',[['Field','Value'],['Calculator',cfg.title],['Formula',cfg.formula],...cfg.variables.map(v=>[v.label,values[v.name]+(v.unit?' '+v.unit:'')]),['Result',result+(cfg.unit?' '+cfg.unit:'')]]);}catch(e){err.textContent=e.message||'Calculation failed.';err.hidden=false;$('embed-output').innerHTML='';}});form.dispatchEvent(new Event('submit',{cancelable:true}));}catch(e){err.textContent=e.message||'Could not load this calculator.';err.hidden=false;}}
boot();})();
</script></body></html>
